name: deploy

# Push to main only, after tests pass. Not a cron.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Skip deploy: set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID to enable GitHub Actions deploy."
            echo "Or import this repo in the Vercel dashboard; that also deploys on push to main."
            exit 0
          fi
          npx vercel@59 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@59 build --prod --yes --token="$VERCEL_TOKEN"
          npx vercel@59 deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
